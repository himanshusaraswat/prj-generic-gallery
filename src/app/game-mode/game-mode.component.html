<div class="container gallery py-3">
  <div class="row justify-content-center">
    @let card = currentCard();

    <div class="col-lg-5 col-md-7 col-sm-10 d-flex justify-content-center mb-4">
      <mat-card class="mat-card-container shadow-lg" [class.mat-card-container-shake]="shake()">
        <mat-card-header class="align-items-center">
          <div
            mat-card-avatar
            class="mat-card-header-image mb-0"
            [class.nfl-avatar]="selectedCategory() === 'nfl'"
            [class.marvel-avatar]="selectedCategory() !== 'nfl'"
          ></div>
        </mat-card-header>

        <div class="image-wrapper my-2">
          @if (loading() || !card) {
            <app-loader />
          } @else {
            <img
              mat-card-image
              width="260"
              height="340"
              [src]="getImageUrl(card)"
              fetchpriority="high"
              alt="Mystery trivia character"
              class="card-img-modern"
            />
          }
        </div>

        <form class="d-flex flex-column px-3 pb-3" (ngSubmit)="onSubmit()">
          <mat-card-content class="mt-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>
                @if (selectedCategory() === 'nfl') {
                  Guess NFL Player's Name
                } @else {
                  Guess Superhero or Alter-Ego
                }
              </mat-label>
              <input
                matInput
                type="text"
                [formField]="guessForm.name"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                enterkeyhint="go"
                placeholder="e.g. Iron Man or Tony Stark"
              />
              @if (guessForm.name().invalid() && guessForm.name().touched()) {
                <mat-error>Please enter a guess</mat-error>
              }
            </mat-form-field>

            <!-- Accessible Feedback Alert -->
            @if (feedback()) {
              <div
                class="alert py-2 px-3 text-center rounded-3 fw-bold"
                [class.alert-success]="feedbackSuccess()"
                [class.alert-danger]="!feedbackSuccess()"
                role="alert"
                aria-live="polite"
              >
                {{ feedback() }}
              </div>
            }
          </mat-card-content>

          <mat-card-actions class="d-flex justify-content-between align-items-center pt-2 px-1">
            <button
              mat-raised-button
              color="primary"
              type="submit"
              (click)="onSubmit()"
              class="px-4 fw-bold submit-btn"
              [disabled]="guessForm().invalid() || isVerifying()"
            >
              @if (isVerifying()) {
                Checking...
              } @else {
                Submit
              }
            </button>

            <button
              mat-button
              type="button"
              class="px-3 skip-btn fw-bold"
              (click)="onSkip()"
              [disabled]="loading() || isVerifying()"
            >
              Skip
            </button>
          </mat-card-actions>
        </form>
      </mat-card>
    </div>
  </div>
</div>
