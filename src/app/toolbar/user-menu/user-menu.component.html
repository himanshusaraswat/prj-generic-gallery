@if (currentUser(); as user) {
  <div class="user-menu-wrapper d-flex align-items-center">
    <div>
      <h4 class="welcome-txt m-0">Welcome, {{ user.displayName || 'Fan Club Member' }}</h4>
    </div>
    <div class="menu-items-container ms-1">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
        <mat-icon style="color: #fff">account_circle</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="auth.logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
}
