name: Deploy to Firebase Hosting on Merge to Develop

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'firebase.json'
      - '.firebaserc'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: 'CI Quality Verification (Lint, Typecheck, Test, Build)'
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4

      - id: setupNode
        name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: lint
        name: Run ESLint
        run: npm run lint

      - id: format
        name: Check Code Formatting
        run: npm run format:check

      - id: typecheck
        name: Run TypeScript Compilation Check
        run: npm run typecheck

      - id: unitTests
        name: Run Zoneless Unit Tests (Vitest)
        run: npm run test:unit

      - id: build
        name: Build Production Artifacts
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: npm run build-prod

      - id: installPlaywright
        name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - id: visualTests
        name: Run Visual Regression Suite (Playwright)
        run: npm run test:visual

      - id: uploadPlaywrightReport
        name: Upload Visual Diff Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 14

      - id: storeDist
        name: Store Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/browser

  deploy:
    name: 'Deploy to Firebase Hosting'
    runs-on: ubuntu-latest
    needs: [ci] # 🔒 Hard Gate: CD NEVER runs if CI fails or is cancelled
    steps:
      - id: checkout
        name: Checkout Repo
        uses: actions/checkout@v4

      - id: downloadDist
        name: Download Verified Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/browser

      - id: auth
        name: Authenticate to Google Cloud via Workload Identity Federation (Keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - id: deploy
        name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx firebase-tools@15.34.0 deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }}
